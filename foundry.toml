# bytecode_hash = "none" is what the IMD launch gate requires: with the default, solc appends a
# metadata digest that varies with absolute paths, so the same source compiled in two directories
# produces two different creation-code hashes.
[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
via_ir = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "v4-core/=lib/v4-core/",
    "solmate/=lib/solmate/",
]
